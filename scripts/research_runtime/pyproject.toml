[project]
name = "hgt-lean-research-runtime"
version = "0.1.0"
description = "Pinned local-only inference environment for Lean corpus search"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.13.0",
  "transformers==4.56.2",
  "huggingface-hub==0.35.3",
  "numpy==2.3.3",
  "faiss-cpu==1.12.0",
  "mlx==0.29.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.28.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
